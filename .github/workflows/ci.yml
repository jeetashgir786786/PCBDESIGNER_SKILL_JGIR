name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, validate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest -q
      - name: Validate skill
        run: python tools/package_skill.py --check-only
      - name: Build skill ZIP
        run: python tools/package_skill.py
      - name: Upload ZIP
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: skill-zip
          path: dist/*.zip
          if-no-files-found: error
