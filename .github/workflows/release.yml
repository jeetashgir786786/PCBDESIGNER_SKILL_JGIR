name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check
        run: |
          ruff check .
          pytest -q
      - name: Build skill ZIP for ${{ github.ref_name }}
        run: python tools/package_skill.py --version "${GITHUB_REF_NAME#v}"
      - name: Release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\n**Install:** download `pcbdesigner-skill-jgir-v%s.zip` below and upload it in Claude → Settings → Capabilities → Skills. See [docs/installation.md](https://github.com/%s/blob/main/docs/installation.md).\n' "$VER" "$GITHUB_REPOSITORY" >> notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PCBDESIGNER_SKILL_JGIR ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.zip
